[package]
name = "truehd-atmos-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "C-callable Dolby TrueHD / Atmos (object presentation) decoder for Apple platforms, built on the truehd crate"
publish = false
rust-version = "1.88"

[lib]
name = "truehd_atmos"
# staticlib is what the xcframework ships; rlib lets the Rust tests and examples link it.
crate-type = ["staticlib", "rlib"]

[dependencies]
# truehdd workspace, library crate only. Pinned to an exact commit so a rebuild decodes
# exactly what was verified; bump deliberately and re-run the harness.
# The fork branch is harletty's speed work on truehd (upstream main 02d29cd plus 17 commits,
# the change from truehdd/truehdd#42 among them): blocks decoded in place, table-driven Huffman,
# vectorised prediction filters, whole-block matrices. Byte-identical output, about a third less
# decode time than #42 alone; back to upstream once it is merged. On top of it: the parser
# option and feature that discard matrix interpolation values (branch feat/ignore-interpolation).
truehd = { git = "https://github.com/superuser404notfound/truehdd", rev = "33bae1657ceb25b5fe0347f42c544c3414e2760e", default-features = false }

[features]
# On by default: the exact decode, matrix interpolation included. Built without it
# (`--no-default-features`, or TRUEHD_ATMOS_NO_INTERPOLATION=1 for build.sh and verify.sh), the
# library reads a stream's matrix interpolation values and discards them and the interpolating
# decode is not compiled in; object presentations of streams that interpolate then no longer decode
# bit-exactly, channel-based presentations are exact either way.
default = ["matrix-interpolation"]
matrix-interpolation = ["truehd/matrix-interpolation"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
# Unwinding stays on: every exported function catches panics at the FFI boundary.
panic = "unwind"
incremental = false

[profile.dev]
# The decoder is too slow unoptimised to run the sample tests in reasonable time.
opt-level = 2

[dev-dependencies]
anyhow = "1.0"
